status:
  scope: >-
    Theorem 1.1 is formalized in full for dimension d at least 1, exponents 1 < p <= q,
    regularity exponent epsilon > 0 and sparseness parameter 0 < gamma < 1, for real or complex
    scalars and arbitrary Banach spaces B_1, B_2, with test functions the compactly supported
    Borel simple functions. Also formalized, as prerequisites: the weak type (1,1) bound for the
    Hardy-Littlewood maximal function, a Whitney decomposition, and the equivalence of sparse and
    Carleson families with the splitting lemma. Not formalized: Corollary 1.2 and Section 4.3,
    the necessary conditions of Section 2, and the applications of Sections 5-7.
