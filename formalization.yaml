fidelity:
  divergences: >-
    (1) The maximal sparse form is the supremum over gamma-sparse families contained in any dyadic
    lattice in the sense of Lerner-Nazarov, rather than in one fixed lattice; this is the reading
    under which the argument of Section 4.2 proves the theorem with a lattice-independent
    constant. (2) Weak L^{p,infinity} and Lorentz L^{q,1} quasinorms follow Grafakos' normalization
    instead of the f** normalization of the paper, which changes A(p) and A(q) by factors
    depending only on p and q. (3) The adjoint regularity hypothesis is stated in dual (bilinear)
    form, which is implied by the hypothesis of the paper and is exactly what the proof uses.
    (4) Simple functions and the sets in the definition of sparseness are Borel rather than
    Lebesgue measurable. (5) The dimension d is assumed to be at least 1. (6) The constant K
    depends only on d, p, q, epsilon and gamma, as in the paper; its value is not optimized.
    Internal deviations in the proof (finite truncations of Whitney sums, a modified exceptional
    set, a different proof of Corollary 3.4 with B replaced by B + A_0 there, and a direct
    induction on the number of scales) do not affect the statement and are documented in
    automation/ErrorReport.md.

