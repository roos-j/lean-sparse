version: "v0.4"

project:
  name: "Multi-scale sparse domination in Lean"
  description: >-
    This is a Lean 4 formalization of the main theorem (Theorem 1.1) from the paper
    "Multi-scale sparse domination" by D. Beltran, J. Roos and A. Seeger.


    A bilinear form sparse domination theorem is proved that applies to many multi-scale
    operators beyond Calderon-Zygmund theory. For a family of operators T_j on vector-valued
    functions on Euclidean space, satisfying a support condition at scale 2^j, uniform weak type
    (p,p) and restricted strong type (q,q) bounds for their partial sums, uniform single-scale
    L^p to L^q bounds and an epsilon-regularity condition together with its adjoint version, the
    bilinear forms of all partial sums are dominated by maximal sparse forms. The constant is the
    sum of the weak type and restricted strong type constants plus the single-scale constant
    times the logarithm of two plus the ratio of the regularity constant to the single-scale
    constant, up to a factor depending only on the dimension, the exponents, the regularity
    exponent and the sparseness parameter. The necessary conditions and the applications to
    Fourier multipliers, maximal functions, square functions and variation norm operators in the
    paper are not formalized.


    Reference: Mem. Amer. Math. Soc. 298 (2024), no. 1491, https://doi.org/10.1090/memo/1491,
    arXiv:2009.00227v3, https://arxiv.org/abs/2009.00227v3.
  authors:
    - "Joris Roos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joris Roos"

